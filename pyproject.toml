[project]
name = "codesentinel"
version = "1.0.0"
description = "Multi agent code review system built with LangGraph and Streamlit (Week 3 project, Mastering Agentic AI)"
readme = "README.md"
authors = [
    { name = "balum211", email = "150282045+balum211@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp[cli]>=2.3.0,<3",
    "pandas>=2.2",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.40",
]

[project.optional-dependencies]
mem0 = ["mem0ai>=0.1.100"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
